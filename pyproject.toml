[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "podbot"
version = "1.0.0rc1"
description = "Local-first POD design, SEO and assisted publishing desktop application"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["Pillow>=10.4,<13", "customtkinter>=5.2.2,<7", "keyring>=25,<27"]

[project.optional-dependencies]
hf = ["huggingface_hub>=0.34,<2"]
bg = ["rembg[cpu]>=2.0.67,<3"]
dev = ["pytest>=8,<10", "pyinstaller>=6,<8", "ruff>=0.8"]

[project.scripts]
podbot = "podbot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
