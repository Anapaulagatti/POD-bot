name: Release Windows Preview (tag with checksum)
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify tag matches package version and points to main
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          if ("v" + $version -ne "$env:GITHUB_REF_NAME") { throw "Tag must match pyproject version" }
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) { throw "Only release commits on main." }
      - name: Install committed Windows hash-locked dependencies
        shell: pwsh
        run: |
          python -m pip install --require-hashes -r requirements/windows-py312.lock.txt
          python -m pip install --no-deps -e .
          python -m pip check
      - name: Audit installed dependencies (fail closed)
        run: python -m pip_audit --local
      - name: Test and lint
        shell: pwsh
        run: |
          python -m pytest -q
          python -m compileall -q src
          python -m ruff check src tests
      - name: Build Windows onedir
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name PODBot --paths src --collect-all customtkinter --collect-submodules keyring.backends --collect-submodules huggingface_hub src/podbot/app.py
          if (!(Test-Path "dist/PODBot/PODBot.exe")) { throw "onedir EXE missing" }
      - name: Archive onedir before second PyInstaller build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release-assets -Force | Out-Null
          Compress-Archive -Path "dist/PODBot" -DestinationPath "release-assets/PODBot-$env:GITHUB_REF_NAME-windows-onedir.zip"
      - name: Build Windows onefile legacy artifact
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name PODBot --paths src --collect-all customtkinter --collect-submodules keyring.backends --collect-submodules huggingface_hub src/podbot/app.py
          if (!(Test-Path "dist/PODBot.exe")) { throw "onefile EXE missing" }
      - name: Prepare assets and SHA256SUMS
        shell: pwsh
        run: |
          Copy-Item "dist/PODBot.exe" "release-assets/PODBot-$env:GITHUB_REF_NAME-windows-onefile.exe"
          Copy-Item "requirements/windows-py312.lock.txt" "release-assets/requirements-windows-py312.lock.txt"
          $files = Get-ChildItem release-assets -File
          $lines = $files | ForEach-Object { $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(); "$hash  $($_.Name)" }
          $lines | Set-Content -Path "release-assets/SHA256SUMS.txt" -Encoding utf8
          if (!(Test-Path "release-assets/SHA256SUMS.txt")) { throw "Missing checksum manifest" }
      - uses: actions/upload-artifact@v4
        with:
          name: PODBot-preview-release-assets
          path: release-assets/*
          if-no-files-found: error
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/*.zip
            release-assets/*.exe
            release-assets/*.txt
